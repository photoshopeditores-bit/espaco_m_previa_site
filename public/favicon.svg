<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield/Hexagon -->
  <rect width="64" height="64" rx="16" fill="#07090e" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#neonGradient)" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Stylized Cyberpunk "M" -->
  <path d="M16 46 L16 18 L32 34 L48 18 L48 46 M32 34 L32 46" 
        stroke="url(#neonGradient)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />
  <circle cx="32" cy="18" r="2.5" fill="#00f2fe" />
</svg>
